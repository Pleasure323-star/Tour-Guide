name: FE preview status

# Posts the Preview status the moment a PR event happens, so it sits next to the other checks while
# "PR checks" builds the preview: pending "Building on a GitHub runner", or "No automatic preview" for forks
# that don't get one. fe-preview-deploy.yml takes it from there. Never checks out PR code.
# Logic: `fe-preview.sh queued`.

on:
  pull_request_target:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - edited

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: fe-preview-status-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  status:
    name: Preview status
    # Unrelated labels and title-only edits can't change the preview, so they take no runner.
    if: >-
      github.repository == 'zedu-hng/zedu-fe' && vars.COOLIFY_PREVIEW_APP != '' &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview') &&
      (github.event.action != 'edited' || github.event.changes.body != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      COOLIFY_URL: ${{ vars.COOLIFY_URL }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_PREVIEW_APP: ${{ vars.COOLIFY_PREVIEW_APP }}
      PR: ${{ github.event.pull_request.number }}
      ACTION: ${{ github.event.action }}
      LABEL: ${{ github.event.label.name }}
      BODY_CHANGED: ${{ github.event.changes.body != null }}
      BODY_FROM: ${{ github.event.changes.body.from }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          persist-credentials: false

      - name: Post Preview status
        run: bash .github/scripts/fe-preview.sh queued "$PR"
